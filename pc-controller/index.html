<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Controller</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #081a2b; color: #fff; }
    .container { padding: 20px; }
    .badge { background: #0f6aaf; color: white; padding: 6px 12px; border-radius: 10px; margin-right: 6px; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>PC Controller</h1>
    <p>Este proceso se debe ejecutar en modo oculta pero permite emparejar y ver estado.</p>

    <div class="block">
      <label>Servidor API:</label>
      <input id="serverUrl" type="text" placeholder="http://localhost:3000" />
    </div>
    <div class="block">
      <label>Identificación de PC:</label>
      <input id="pcId" type="text" placeholder="pc-1" />
    </div>

    <button id="btnSave">Guardar configuración</button>

    <div class="row">
      <button id="btnConnect">Conectar PC (un clic)</button>
      <button id="btnRefreshStatus">Refrescar estado</button>
    </div>

    <div class="row">
      <button id="btnLockPC">Bloquear PC</button>
      <button id="btnUnlockPC">Desbloquear PC</button>
    </div>

    <div class="block">Estado: <strong id="statusText">inicializando...</strong></div>
    <div class="block">Token agente: <strong id="agentToken">(pendiente)</strong></div>
    <div class="block" style="margin-top:8px;">
      <button id="btnInstallUpdate" style="display:none;padding:8px 12px;background:#F59E0B;color:#111;border:none;border-radius:8px;cursor:pointer;">Actualizar usado</button>
    </div>

    <div class="block" style="margin-top: 12px;">
      <label>Terminal de depuración:</label>
      <pre id="terminal" style="background:#08212e;color:#39ff90;padding:12px;border-radius:10px;height:220px;overflow:auto;white-space:pre-wrap;line-height:1.2;font-size:11px;"></pre>
      <button id="btnClearLog" style="margin-top:8px;padding:6px 10px;border:none;border-radius:8px;background:#555;color:#fff;cursor:pointer;">Limpiar terminal</button>
    </div>

    <div id="state"></div>
  </div>

  <script>
    const serverUrlInput = document.getElementById('serverUrl');
    const pcIdInput = document.getElementById('pcId');
    const agentTokenEl = document.getElementById('agentToken');
    const statusText = document.getElementById('statusText');

    document.getElementById('btnSave').addEventListener('click', async () => {
      const serverUrl = serverUrlInput.value.trim();
      const pcId = pcIdInput.value.trim();
      const pcNameValue = pcId;

      const result = await window.pcController.saveSettings(serverUrl, pcId, pcNameValue);
      statusText.innerText = `Configuración guardada: ${result.serverUrl} / ${result.pcId}`;

      const update = await window.pcController.updateAgentName(pcId, pcNameValue);
      statusText.innerText = update.success
        ? `Nombre PC establecido como identificador: ${pcNameValue}`
        : `Error al establecer nombre: ${update.error}`;
    });

    document.getElementById('btnConnect').style.display = 'none';
    document.getElementById('btnRefreshStatus').style.display = 'none';
    document.getElementById('btnLockPC').style.display = 'none';
    document.getElementById('btnUnlockPC').style.display = 'none';

    statusText.innerText = 'Automático: el agente intentará emparejar y registrar al iniciarse.';

    document.getElementById('btnRefreshStatus').addEventListener('click', () => {
      statusText.innerText = 'Refrescando estado...';
      // Se actualiza desde el evento onStatusUpdate del main
    });

    document.getElementById('btnInstallUpdate').addEventListener('click', async () => {
      statusText.innerText = 'Iniciando actualización...';
      const result = await window.pcController.installUpdate();
      statusText.innerText = result.success ? 'Instalador lanzado; la app se cerrará.' : 'Error en la actualización';
    });

    document.getElementById('btnLockPC').addEventListener('click', async () => {
      const resultado = await window.pcController.sendCommand('lock', { message: 'Bloqueo manual desde el agente' });
      statusText.innerText = resultado.success ? 'Comando lock enviado' : `Error lock: ${resultado.error}`;
    });

    document.getElementById('btnUnlockPC').addEventListener('click', async () => {
      const resultado = await window.pcController.sendCommand('unlock', { message: 'Desbloqueo manual desde el agente' });
      statusText.innerText = resultado.success ? 'Comando unlock enviado' : `Error unlock: ${resultado.error}`;
    });

    const terminal = document.getElementById('terminal');
    const btnClearLog = document.getElementById('btnClearLog');

    const renderLogs = (lines = []) => {
      terminal.textContent = lines.join('\n');
      terminal.scrollTop = terminal.scrollHeight;
    };

    btnClearLog.addEventListener('click', () => {
      terminal.textContent = '';
    });

    window.pcController.onStatusUpdate((data) => {
      serverUrlInput.value = data.serverUrl;
      pcIdInput.value = data.pcId;
      agentTokenEl.innerText = data.agentToken ? '✅' : '(sin token)';
      statusText.innerText = data.connectionMessage || `Conectado a ${data.serverUrl} como ${data.pcId}`;

      if (data.logs && Array.isArray(data.logs)) {
        renderLogs(data.logs);
      }

      if (typeof data.pcName !== 'undefined') {
        document.getElementById('pcName').value = data.pcName;
      }

      const btnInstall = document.getElementById('btnInstallUpdate');
      if (data.updateAvailable) {
        btnInstall.style.display = 'inline-block';
        btnInstall.innerText = `Actualizar a ${data.latestVersion}`;
      } else {
        btnInstall.style.display = 'none';
      }

      if (data.connection === 'connected') {
        document.body.style.background = '#0a2f0f';
      } else {
        document.body.style.background = '#2f0a0a';
      }
    });
  </script>
</body>
</html>
